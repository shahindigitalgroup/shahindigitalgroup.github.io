.ctas{display:flex;gap:12px;flex-wrap:wrap}

h2{font-size:clamp(1.6rem,3.2vw,2.3rem);letter-spacing:-.02em;margin-bottom:14px}
html[lang=fa] h2{letter-spacing:0}
.sub{color:var(--muted);max-width:640px;margin-bottom:44px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;transition:border-color .2s}
.card:hover{border-color:var(--accent)}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(79,140,255,.14);margin-bottom:16px}

.card h3{font-size:1.1rem;margin-bottom:8px}
.card p{color:var(--muted);font-size:.95rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:s}
.step{padding:22px;border-radius:var(--radius);background:var(--bg2);border:1px solid var(--line)}

.split{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
.list{list-style:none;display:grid;gap:14px}
